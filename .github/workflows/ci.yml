name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "adapters/sqlindex/v*"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1
      - name: sqlindex (nested module)
        working-directory: adapters/sqlindex
        run: |
          go vet ./...
          go test ./... -count=1

  race:
    name: race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test -race
        run: go test -race ./... -count=1
      - name: sqlindex -race (nested module)
        working-directory: adapters/sqlindex
        run: go test -race ./... -count=1

  # The shared backends test against real servers. Their tests fail, never skip,
  # when the service variables are missing.
  cloud-backends:
    name: cloud backends (postgres, gcs)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: craggy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dev" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      ARTIFACT_SERVICES_POSTGRES_DSN: postgres://dev:dev@localhost:5432/craggy?sslmode=disable
      STORAGE_EMULATOR_HOST: localhost:4443
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start fake-gcs-server
        run: |
          docker run -d --name gcs -p 4443:4443 fsouza/fake-gcs-server:1.52.2 -scheme http -port 4443 -public-host localhost:4443
          for i in $(seq 30); do curl -sf http://localhost:4443/storage/v1/b && break; sleep 1; done
      - name: postgres (nested module)
        working-directory: adapters/postgres
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./... -count=1
      - name: gcs (nested module)
        working-directory: adapters/gcs
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./... -count=1
