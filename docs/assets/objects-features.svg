<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc"><title id="title">OBJECTS / PIN, VALIDATE, QUERY</title><desc id="desc">Typed meaning binds exact data and schema identities.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFB547" stroke-width="1.5"/></marker></defs><rect width="1440" height="600" rx="20" fill="#111A20"/><g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace">
<text x="40" y="50" font-size="28" fill="#FFB547" font-weight="700" text-anchor="start">&gt; OBJECTS / PIN, VALIDATE, QUERY</text>
<text x="40" y="86" font-size="21" fill="#E4ECE7" font-weight="400" text-anchor="start">Typed meaning binds exact data and schema identities.</text>
<text x="1400" y="50" font-size="16" fill="#E4ECE7" font-weight="400" text-anchor="end">PROPOSED MODEL</text>
<path d="M40 111 H1400" fill="none" stroke="#2A2F2C" stroke-width="2"/>
<rect x="40" y="160" width="310" height="115" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="62" y="200" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Schema artifact</text>
<text x="62" y="237" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Exact definition ID</text>
<rect x="40" y="303" width="310" height="115" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="62" y="343" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Data artifact</text>
<text x="62" y="380" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Exact content snapshot</text>
<rect x="460" y="215" width="340" height="175" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="482" y="255" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Validate + publish</text>
<text x="482" y="292" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Encoding + semantics</text>
<text x="482" y="321" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Check actual data</text>
<text x="482" y="350" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">New typed snapshot</text>
<path d="M350 218 H400 V300 H460" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 360 H400 V300" fill="none" stroke="#FFB547" stroke-width="2"/>
<rect x="930" y="160" width="470" height="120" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="952" y="200" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Content-query adapters</text>
<text x="952" y="237" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">SQL/table or JSON capabilities</text>
<path d="M800 260 H865 V220 H930" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="930" y="332" width="470" height="120" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="952" y="372" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Results + coverage</text>
<text x="952" y="409" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Transient stream or saved output</text>
<path d="M1165 280 V332" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M930 400 H830 V451 H630 V390" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 6"/>
<text x="490" y="478" font-size="18" fill="#E4ECE7" font-weight="400" text-anchor="start">Materialize: validate / publish + record lineage</text>
<rect x="40" y="492" width="1360" height="78" rx="12" fill="#2A2F2C" stroke="#7A5C30"/>
<text x="62" y="523" font-size="22" fill="#FFB547" font-weight="700" text-anchor="start">A saved view pins its definition and inputs; it does not contain computed rows.</text>
<text x="62" y="553" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Adapters declare limits and coverage. No arbitrary SQL/JSON support or complete provenance is implied.</text>
</g></svg>
