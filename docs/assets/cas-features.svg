<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc"><title id="title">CAS / IDENTITY IS VERIFIED</title><desc id="desc">Equal bytes share a digest; histories remain independent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFB547" stroke-width="1.5"/></marker></defs><rect width="1440" height="600" rx="20" fill="#111A20"/><g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace">
<text x="40" y="50" font-size="28" fill="#FFB547" font-weight="700" text-anchor="start">&gt; CAS / IDENTITY IS VERIFIED</text>
<text x="40" y="86" font-size="21" fill="#E4ECE7" font-weight="400" text-anchor="start">Equal bytes share a digest; histories remain independent.</text>
<text x="1400" y="50" font-size="16" fill="#E4ECE7" font-weight="400" text-anchor="end">CONTRACT ILLUSTRATION</text>
<path d="M40 111 H1400" fill="none" stroke="#2A2F2C" stroke-width="2"/>
<text x="40" y="153" font-size="18" fill="#FFB547" font-weight="700" text-anchor="start">PUT / HASH BEFORE PUBLICATION</text>
<rect x="40" y="173" width="310" height="150" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="62" y="213" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Stream + spool</text>
<text x="62" y="250" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Bounded copy buffer</text>
<text x="62" y="279" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">SHA-256 identity</text>
<rect x="450" y="173" width="355" height="150" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="472" y="213" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Digest-derived key</text>
<text x="472" y="250" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">New: publish bytes</text>
<text x="472" y="279" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Existing: verify to EOF</text>
<rect x="905" y="173" width="495" height="150" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="927" y="213" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Established availability</text>
<text x="927" y="250" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">ID / size / reused</text>
<text x="927" y="279" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Corruption fails reuse</text>
<path d="M350 249 H450" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M805 249 H905" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="367" font-size="18" fill="#FFB547" font-weight="700" text-anchor="start">OPEN / VERIFICATION FOLLOWS THE READ</text>
<path d="M70 424 H1350" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="70" cy="424" r="6" fill="#FFB547"/>
<text x="70" y="402" font-size="22" fill="#FFB547" font-weight="700" text-anchor="start">Open</text>
<text x="70" y="459" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Presence only</text>
<circle cx="460" cy="424" r="6" fill="#FFB547"/>
<text x="460" y="402" font-size="22" fill="#FFB547" font-weight="700" text-anchor="start">Read chunks</text>
<text x="460" y="459" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Bytes may arrive early</text>
<circle cx="920" cy="424" r="6" fill="#FFB547"/>
<text x="920" y="402" font-size="22" fill="#FFB547" font-weight="700" text-anchor="start">Matching EOF</text>
<text x="920" y="459" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Digest verified</text>
<rect x="40" y="492" width="1360" height="78" rx="12" fill="#2A2F2C" stroke="#7A5C30"/>
<text x="62" y="523" font-size="22" fill="#FFB547" font-weight="700" text-anchor="start">Early Close does not verify or drain the remaining stream.</text>
<text x="62" y="553" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">A mismatching digest returns an integrity error; callers close every returned reader.</text>
</g></svg>
