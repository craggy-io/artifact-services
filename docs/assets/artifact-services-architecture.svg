<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
<title id="title">Artifact Services layer architecture</title>
<desc id="desc">Objects and Lineage are peers depending on Artifacts, which depends on CAS, which depends on Storage. Shared context and observability span every layer. Objects owns schemas and content-query adapters; lineage stores generic provenance and row-column references. This is an architectural design, not an implementation status chart.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFB547" stroke-width="1.5"/></marker></defs>
