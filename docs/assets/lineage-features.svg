<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc"><title id="title">LINEAGE / DERIVATION IS NOT REVISION</title><desc id="desc">A and B keep their histories; a derived C starts its own.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFB547" stroke-width="1.5"/></marker></defs><rect width="1440" height="600" rx="20" fill="#111A20"/><g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace">
