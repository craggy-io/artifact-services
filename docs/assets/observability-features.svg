<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc"><title id="title">OBSERVABILITY / ONE CONTEXT, DISTINCT WORK</title><desc id="desc">Trace ancestry flows down; each scope reports its own counters.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFB547" stroke-width="1.5"/></marker></defs><rect width="1440" height="600" rx="20" fill="#111A20"/><g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace">
<text x="40" y="50" font-size="28" fill="#FFB547" font-weight="700" text-anchor="start">&gt; OBSERVABILITY / ONE CONTEXT, DISTINCT WORK</text>
<text x="40" y="86" font-size="21" fill="#E4ECE7" font-weight="400" text-anchor="start">Trace ancestry flows down; each scope reports its own counters.</text>
<text x="1400" y="50" font-size="16" fill="#E4ECE7" font-weight="400" text-anchor="end">CONTRACT ILLUSTRATION</text>
<path d="M40 111 H1400" fill="none" stroke="#2A2F2C" stroke-width="2"/>
<rect x="40" y="168" width="400" height="118" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="62" y="208" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Parent operation / User</text>
<text x="62" y="245" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Inclusive elapsed time</text>
<rect x="100" y="333" width="340" height="120" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="122" y="373" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Child scope / User</text>
<text x="122" y="410" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Its own bytes + counters</text>
<rect x="510" y="333" width="340" height="120" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="532" y="373" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Internal child scope</text>
<text x="532" y="410" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Support work + counters</text>
<path d="M240 286 V310 H270 V333" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M240 310 H680 V333" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="510" y="202" font-size="22" fill="#E4ECE7" font-weight="400" text-anchor="start">Derived context carries</text>
<text x="510" y="236" font-size="22" fill="#E4ECE7" font-weight="400" text-anchor="start">parent ID + configuration</text>
<text x="510" y="270" font-size="21" fill="#FFB547" font-weight="700" text-anchor="start">Internal is inherited.</text>
<rect x="950" y="168" width="450" height="125" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="972" y="208" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Default reporting</text>
<text x="972" y="245" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">User events / User stats</text>
<rect x="950" y="328" width="450" height="125" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="972" y="368" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Diagnostic opt-in</text>
<text x="972" y="405" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">User + Internal by scope</text>
<path d="M880 168 V453" fill="none" stroke="#7A5C30" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="40" y="492" width="1360" height="78" rx="12" fill="#2A2F2C" stroke="#7A5C30"/>
<text x="62" y="523" font-size="22" fill="#FFB547" font-weight="700" text-anchor="start">The attached collector retains User and Internal aggregates separately.</text>
<text x="62" y="553" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Filtering changes visibility, not work. Child counters do not roll up into parent totals.</text>
</g></svg>
