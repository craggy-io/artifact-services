<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc"><title id="title">STORAGE / ONE PUBLICATION BOUNDARY</title><desc id="desc">Readers see absence or one complete immutable blob.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFB547" stroke-width="1.5"/></marker></defs><rect width="1440" height="600" rx="20" fill="#111A20"/><g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace">
<text x="40" y="50" font-size="28" fill="#FFB547" font-weight="700" text-anchor="start">&gt; STORAGE / ONE PUBLICATION BOUNDARY</text>
<text x="40" y="86" font-size="21" fill="#E4ECE7" font-weight="400" text-anchor="start">Readers see absence or one complete immutable blob.</text>
<text x="1400" y="50" font-size="16" fill="#E4ECE7" font-weight="400" text-anchor="end">CONTRACT ILLUSTRATION</text>
<path d="M40 111 H1400" fill="none" stroke="#2A2F2C" stroke-width="2"/>
<rect x="40" y="190" width="310" height="170" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="62" y="230" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Source stream</text>
<text x="62" y="267" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Caller-owned reader</text>
<text x="62" y="296" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Bounded copying</text>
<rect x="390" y="190" width="310" height="170" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="412" y="230" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Private temp file</text>
<text x="412" y="267" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Write / sync / close</text>
<text x="412" y="296" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Not visible by key</text>
<rect x="740" y="190" width="310" height="170" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="762" y="230" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Atomic hard link</text>
<text x="762" y="267" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Create if absent</text>
<text x="762" y="296" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Never replace</text>
<rect x="1090" y="190" width="310" height="170" rx="12" fill="#16222A" stroke="#7A5C30"/>
<text x="1112" y="230" font-size="25" fill="#FFB547" font-weight="700" text-anchor="start">Published blob</text>
<text x="1112" y="267" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Open by safe key</text>
<text x="1112" y="296" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">Complete bytes</text>
<path d="M350 275 H390" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700 275 H740" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1050 275 H1090" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1070 153 V453" fill="none" stroke="#FFB547" stroke-width="2" stroke-dasharray="6 6"/>
<text x="1070" y="146" font-size="18" fill="#FFB547" font-weight="700" text-anchor="middle">COMMIT</text>
<text x="40" y="412" font-size="21" fill="#E4ECE7" font-weight="400" text-anchor="start">Before publication: failure triggers temp cleanup.</text>
<text x="40" y="447" font-size="21" fill="#E4ECE7" font-weight="400" text-anchor="start">After publication: cleanup errors retain Published=true.</text>
<rect x="40" y="492" width="1360" height="78" rx="12" fill="#2A2F2C" stroke="#7A5C30"/>
<text x="62" y="523" font-size="22" fill="#FFB547" font-weight="700" text-anchor="start">Atomic visibility is not crash durability.</text>
<text x="62" y="553" font-size="20" fill="#E4ECE7" font-weight="400" text-anchor="start">No directory sync or automatic crash recovery; cancellation can race the commit boundary.</text>
</g></svg>
